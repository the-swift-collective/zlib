name: Swift (WASI)

on: [push, pull_request]

jobs:
  build:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }} (WASI)
    strategy:
      matrix:
        os: [macos-26]
        swift: ["6.3.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Swiftly
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
      - name: Install Swift ${{ matrix.swift }}
        run: ~/.swiftly/bin/swiftly install --use ${{ matrix.swift }}
      - name: Install WASM SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.3.2-release/wasm-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
      - name: 🔨 Build
        run: swift build --swift-sdk swift-6.3.2-RELEASE_wasm --triple wasm32-unknown-wasip1
      - name: 🧪 Test
        run: swift test --swift-sdk swift-6.3.2-RELEASE_wasm --triple wasm32-unknown-wasip1
